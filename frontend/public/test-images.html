<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nova AI — Image Generation Test</title>
<style>
  body { background: #0f1115; color: #e6e8ee; font-family: -apple-system, sans-serif; padding: 32px; }
  h1 { font-size: 24px; margin-bottom: 8px; }
  p { color: #999; margin-bottom: 24px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; max-width: 900px; }
  .card { background: #1a1d24; border: 1px solid #2a2d34; border-radius: 12px; overflow: hidden; }
  .card img { width: 100%; display: block; }
  .card .info { padding: 12px 16px; }
  .card .info h3 { margin: 0 0 4px; font-size: 14px; }
  .card .info span { font-size: 12px; color: #666; }
</style>
</head>
<body>
<h1>🎨 Nova AI — Image Generation</h1>
<p>Generated using Pollinations.ai (FREE, no API key)</p>
<div class="grid">
  <div class="card">
    <img src="https://image.pollinations.ai/prompt/a%20futuristic%20AI%20robot%20assistant%20with%20glowing%20blue%20eyes%2C%20digital%20art%2C%20high%20quality?width=1024&height=1024&model=flux&seed=91305&nologo=true" alt="AI Robot">
    <div class="info">
      <h3>Futuristic AI Robot</h3>
      <span>1024×1024 • Flux • 4.4s</span>
    </div>
  </div>
  <div class="card">
    <img src="https://image.pollinations.ai/prompt/beautiful%20sunset%20over%20Berhampur%20city%20Odisha%20India%2C%20golden%20hour%2C%20photorealistic?width=1024&height=576&model=flux&seed=57143&nologo=true" alt="Berhampur Sunset">
    <div class="info">
      <h3>Berhampur Sunset</h3>
      <span>1024×576 • Flux • 18s</span>
    </div>
  </div>
</div>
</body>
</html>
