# Render blueprint — one-click deploy for Nova AI.
# Creates a free PostgreSQL database and the combined web service
# (nginx frontend + uvicorn backend on a single origin).

databases:
  - name: nova-ai-db
    plan: free
    databaseName: nova_ai
    user: nova_ai

services:
  - type: web
    name: nova-ai
    runtime: docker
    repo: https://github.com/rakeshkumartripathy629/NOVA-AI-AGent
    plan: free
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PORT
        value: "10000"
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CEREBRAS_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: "groq/compound-mini"
      - key: MEMORY_EMBEDDING_PROVIDER
        value: "local"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: STT_PROVIDER
        value: groq
      - key: TTS_PROVIDER
        value: edge
      - key: STORAGE_LOCAL_DIR
        value: /var/lib/nova-ai/storage
      - key: DATABASE_URL
        fromDatabase:
          name: nova-ai-db
          property: connectionString
      - key: FRONTEND_URL
        value: https://nova-ai-5q5v.onrender.com
      - key: CORS_ORIGINS
        value: https://nova-ai-5q5v.onrender.com
      - key: FIRST_SUPERUSER_EMAIL
        sync: false
      - key: FIRST_SUPERUSER_PASSWORD
        sync: false
      - key: FIRST_SUPERUSER_USERNAME
        value: admin
